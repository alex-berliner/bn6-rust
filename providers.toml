# providers.toml -- which model does each job, per provider. The one file to edit to swap a subscription.
#
# tools/roles.py renders .pi/agents/<role>-<provider>.md from .pi/roles/<role>.md (the role's prompt, tools
# and thinking level) plus this map, and every launcher, watcher and one-shot tool asks it for its model:
#   python3 tools/roles.py render                 write the agent files (run after editing this file)
#   python3 tools/roles.py model hyper worker     print one model id
#   python3 tools/roles.py budget hyper --start   exit 0 if the provider can start a run now
#   python3 tools/roles.py check                  validate the map
# A provider named here must also exist in pi: ~/.pi/agent/models.json defines custom endpoints (hyper),
# openrouter is built in; the keys live in ~/.pi/agent/auth.json. Model ids are pi's "<provider>/<model>".
#
# Roles: coordinator runs the loop (.pi/coordinator.md); worker implements a ticket; verifier checks a
# landed branch's claims (a different model family from the worker); recon maps code for a ticket;
# judge proposes tickets; auditor proposes setup changes; digest writes the daily blog paragraph.

[schedule]
active = ["hyper"]        # providers that run, in this order: the launcher starts the first one with budget
parallel = false          # true: one run per active provider at the same time (tickets are claimed per run,
                          # landings and verifications serialize on their locks)
reserve = ["openrouter"]  # never started by the launcher; a human starts a run on it by hand
workers = 2               # worker slots per run

[providers.hyper]
kind = "subscription"                     # a daily credit balance: the day's credits are spent to the end
price_usd_per_month = 20                  # what the subscription costs; with daily_credits it prices a credit
daily_credits = 250
credits_per_nominal_usd = 26               # measured 2026-09-14 (164 credits for $6.3 of list-price usage); the benchmark's fallback
probe = "python3 tools/hyper_credits.py"  # prints the balance; --min N exits 1 below N and 2 on a probe error
start_above = 10                          # a run starts only with at least this many credits (one ticket's worth)
stop_below = 3                            # the watcher stops a run under this many
tail = true                               # under start_above: spend the rest on one judge pass and recon maps

[providers.hyper.roles]
coordinator = "hyper/qwen3.8-flash"
worker = "hyper/glm-5.3-flash"
verifier = "hyper/qwen3.8-flash"
recon = "hyper/deepseek-v4.1-flash"
judge = "hyper/qwen3.8-flash"
auditor = "hyper/qwen3.8-flash"
digest = "hyper/qwen3.8-flash"

[providers.openrouter]
kind = "payg"                             # pay as you go, in dollars
probe = "python3 tools/or_spend.py"       # prints "used today $X, total $Y, ... remaining $R"
floor_usd = 0.50                          # never spend the account below this
start_above = 1.0                         # dollars above the floor a run needs to start
cap_per_run_usd = 5                       # the run's cap watcher stops it past this much real spend
tail = false

[providers.openrouter.roles]
coordinator = "openrouter/meta/muse-spark-1.3-contributor"
worker = "openrouter/meta/muse-spark-1.3-contributor"
verifier = "openrouter/z-ai/glm-5.3-flash"
recon = "openrouter/deepseek/deepseek-v4.1-flash"
judge = "openrouter/meta/muse-spark-1.3-contributor"
auditor = "openrouter/meta/muse-spark-1.3-contributor"
digest = "openrouter/meta/muse-spark-1.3-contributor"
