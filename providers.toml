# providers.toml -- the agent setup as data: providers (a budget each), run profiles (a model per job, from any
# provider, with fallbacks), and the schedule. The only file to edit to swap or combine subscriptions.
#
#   python3 tools/roles.py check                validate this file
#   python3 tools/roles.py resolve hyper        which model each role of run "hyper" gets right now
#   python3 tools/roles.py render               write the pi agent files (.pi/agents/<role>-<run>.md)
#   python3 tools/roles.py model hyper judge    one resolved model id
#   python3 tools/roles.py budget hyper --start exit 0 if PROVIDER hyper can start work now (1 no, 2 probe error)
#
# A provider named here must also exist in pi (~/.pi/agent/models.json for custom endpoints such as hyper;
# openrouter is built in; keys in ~/.pi/agent/auth.json). Model ids are pi's "<provider>/<model>".
#
# Jobs: coordinator runs the loop (.pi/coordinator.md); worker implements a ticket; verifier checks a landed
# branch's prose claims (verify_rows, the model-free check, gates every landing regardless); recon maps code
# for a ticket; judge proposes tickets; auditor proposes setup changes; digest writes the daily blog paragraph.
#
# A run profile lists CANDIDATES per job in preference order, from any provider: at launch each job takes the
# first candidate whose provider can start work, and the run's watcher stops it when the provider of its
# coordinator or worker is exhausted; the cron launcher (tools/run_day.sh, every 30 min) then relaunches it,
# resolving again -- so a run whose coordinator sits on hyper carries on with its fallback coordinator once
# hyper's day is spent, and every subscription keeps draining. That is joint orchestration: e.g. hyper's
# coordinator over minimax's workers while both have budget.

[schedule]
runs = ["hyper"]          # run profiles to keep going, in order; serial: the first that can start; parallel: all
parallel = false
reserve = ["openrouter"]  # runs never started by the launcher; a human starts one by hand (BN_RUN=openrouter)

# ---------------------------------------------------------------- providers: one budget each
[providers.hyper]
kind = "subscription"                     # a daily credit balance the user wants spent to the end
probe = "python3 tools/hyper_credits.py"  # prints the balance; --min N exits 1 below N and 2 on a probe error
start_above = 10                          # work starts on it only with at least this many credits (a ticket's worth)
stop_below = 3                            # the watcher stops a run whose coordinator or worker sits on it under this
tail = true                               # under start_above: spend the rest on one judge pass and recon maps
price_usd_per_month = 20                  # with daily_credits: the real price of a credit, for the benchmarks
daily_credits = 250
credits_per_nominal_usd = 26              # measured 2026-09-14 (164 credits for $6.3 of list-price usage); the benchmark's fallback
reset = "daily 10:35"                     # when the balance refreshes (local time); the pacing rule needs it
coordinator_credits_per_hour = 4          # measured 2026-09-14: run 10's coordinator, ~15 credits over 3.9 h
worker_credits_per_hour = 20              # measured 2026-09-14: ~164 credits over ~8 worker-hours, verification waits included

[providers.openrouter]
kind = "payg"                             # pay as you go, in dollars
probe = "python3 tools/or_spend.py"       # prints "used today $X, total $Y, ... remaining $R"
floor_usd = 0.50                          # never spend the account below this
start_above = 1.0                         # dollars above the floor that work needs to start
cap_per_run_usd = 5                       # the run's cap watcher stops it past this much real spend
tail = false

# [providers.minimax]                     # the next candidate (the user, 2026-09-14): fill in after the endpoint
# kind = "subscription"                   # and key are in pi's models.json/auth.json; the plan meters a rolling
