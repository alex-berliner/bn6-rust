# providers.toml -- the agent setup as data: providers (a budget each), run profiles (a model per job, from any
# provider, with fallbacks), and the schedule. The only file to edit to swap or combine subscriptions.
#
#   python3 tools/roles.py check                validate this file
#   python3 tools/roles.py resolve hyper        which model each role of run "hyper" gets right now
#   python3 tools/roles.py render               write the pi agent files (.pi/agents/<role>-<run>.md)
#   python3 tools/roles.py model hyper judge    one resolved model id
#   python3 tools/roles.py budget hyper --start exit 0 if PROVIDER hyper can start work now (1 no, 2 probe error)
#
# A provider named here must also exist in pi (~/.pi/agent/models.json for custom endpoints such as hyper;
# openrouter is built in; keys in ~/.pi/agent/auth.json). Model ids are pi's "<provider>/<model>".
#
# Jobs: coordinator runs the loop (.pi/coordinator.md); worker implements a ticket; verifier checks a landed
# branch's prose claims (verify_rows, the model-free check, gates every landing regardless); recon maps code
# for a ticket; judge proposes tickets; auditor proposes setup changes; digest writes the daily blog paragraph.
#
# A run profile lists CANDIDATES per job in preference order, from any provider: at launch each job takes the
# first candidate whose provider can start work, and the run's watcher stops it when the provider of its
# coordinator or worker is exhausted; the cron launcher (tools/run_day.sh, every 30 min) then relaunches it,
# resolving again -- so a run whose coordinator sits on hyper carries on with its fallback coordinator once
# hyper's day is spent, and every subscription keeps draining. That is joint orchestration: e.g. hyper's
# coordinator over minimax's workers while both have budget.

[roundup]
# who writes the human-readable output of the 09:15 roundup. "claude:<model>" runs the Claude Code CLI headless
# (claude -p) on the user's own plan -- the user asked for an Opus 5 writer for the blog (2026-09-15) after the
# worker-class models produced accounts that named tickets without saying what they were; "pi" uses the run
# profiles' digest job instead.
digest_writer = "claude:claude-opus-5"

[schedule]
runs = ["hyper", "minimax"]   # run profiles to keep going, in order; serial: the first that can start; parallel: all
parallel = true               # 2026-09-14 evening: two independent runs, each self-sufficient (M3 coordinated a full
                              # cycle correctly: T7e landed 19:07); tickets are claimed per run
reserve = ["openrouter"]      # runs never started by the launcher; a human starts one by hand (BN_RUN=...)

# ---------------------------------------------------------------- providers: one budget each
[providers.hyper]
kind = "subscription"                     # a daily credit balance the user wants spent to the end
# Also an HOURLY rate limit (429 "hourly rate limit", 2026-09-14): a coordinator plus two workers is sustainable;
# a fourth concurrent session (a benchmark beside the run) tripped it and starved the run. Benchmarks on hyper
# therefore run alone (tools/run_day.sh starts a queued benchmark before the day's run, never beside it).
probe = "python3 tools/hyper_credits.py"  # prints the balance; --min N exits 1 below N and 2 on a probe error
start_above = 10                          # work starts on it only with at least this many credits (a ticket's worth)
stop_below = 3                            # the watcher stops a run whose coordinator or worker sits on it under this
tail = true                               # under start_above: spend the rest on one judge pass and recon maps
price_usd_per_month = 20                  # with daily_credits: the real price of a credit, for the benchmarks
daily_credits = 250
credits_per_nominal_usd = 36              # measured 2026-09-14 (164 credits for about $4.6 of list-price usage, after the parser fix); the benchmark's fallback
reset = "daily 10:35"                     # when the balance refreshes (local time); the pacing rule needs it
coordinator_credits_per_hour = 4          # measured 2026-09-14: run 10's coordinator, ~15 credits over 3.9 h
worker_credits_per_hour = 20              # measured 2026-09-14: ~164 credits over ~8 worker-hours, verification waits included

[providers.openrouter]
kind = "payg"                             # pay as you go, in dollars
probe = "python3 tools/or_spend.py"       # prints "used today $X, total $Y, ... remaining $R"
floor_usd = 0.50                          # never spend the account below this
start_above = 1.0                         # dollars above the floor that work needs to start
cap_per_run_usd = 5                       # the run's cap watcher stops it past this much real spend
tail = false

[providers.minimax]
kind = "subscription"                     # the $22/month coding plan: a rolling 5-hour window and a weekly cap, both
probe = "python3 tools/minimax_quota.py"  # reported as a remaining percentage by its own endpoint; --min N is in percent
start_above = 10                          # percent of the window a run needs to start; the probe also refuses once the
stop_below = 2                            # day's weekly ALLOWANCE is spent (weekly remainder / days left, measured each
tail = false                              # morning), so the week lasts the week: about 0.7% of the week per ticket cycle
reset = "rolling 5h"                      # (2026-09-14), i.e. roughly 20 cycles a day at an even spend
oneshot_flags = "--ignore-allowance"     # one-shot sessions (digest, learn slides, judge) may run on a spent allowance
price_usd_per_month = 22
daily_credits = 480                       # 100 percent points per 5-hour window, 4.8 windows a day: the price of a point

[providers.minimax.pacer]                 # the plan also refuses bursts ("Token Plan rate limit reached", code 2062) long before
port = 8791                               # the window is used up: one worker at pi's pace tripped it after 84 turns in 3 minutes
upstream = "https://api.minimax.io"       # (2026-09-14). tools/api_pacer.py sits at 127.0.0.1:8791 (pi's baseUrl for minimax),
rpm = 20                                  # spaces request starts, and retries 429s itself, so the agents never see them.
concurrency = 2

# ---------------------------------------------------------------- run profiles: candidates per job, in order
[runs.hyper]
workers = 2                               # worker slots in flight
coordinator = ["hyper/qwen3.8-flash"]
worker = ["hyper/glm-5.3-flash"]
verifier = ["hyper/qwen3.8-flash"]
recon = ["hyper/deepseek-v4.1-flash"]
judge = ["hyper/qwen3.8-flash"]
auditor = ["hyper/qwen3.8-flash"]
digest = ["hyper/qwen3.8-flash"]

[runs.openrouter]
workers = 2
coordinator = ["openrouter/meta/muse-spark-1.3-contributor"]
worker = ["openrouter/meta/muse-spark-1.3-contributor"]
verifier = ["openrouter/z-ai/glm-5.3-flash"]
recon = ["openrouter/deepseek/deepseek-v4.1-flash"]
judge = ["openrouter/meta/muse-spark-1.3-contributor"]
auditor = ["openrouter/meta/muse-spark-1.3-contributor"]
digest = ["openrouter/meta/muse-spark-1.3-contributor"]

# A joint plan the user sketched (2026-09-14), NOT a rule: nothing decides it until minimax is benchmarked on the
# same seven tickets (tools/bench_provider.py) and its pass rate, minutes and quota per pass are on the table
# next to hyper's. If adopted: coordinate minimax's workers from hyper while minimax's window is open, and burn
# whatever hyper credit that leaves with hyper's own workers before hyper's daily reset.
#
# [schedule]
# runs = ["joint", "hyper"]
# parallel = true
#
# [runs.joint]                            # hyper's coordinator and verifier over minimax's workers; minimax's own
# workers = 2                             # coordinator only once hyper is spent
# coordinator = ["hyper/qwen3.8-flash", "minimax/MiniMax-M3"]
# worker = ["minimax/MiniMax-M3"]
# verifier = ["hyper/qwen3.8-flash", "minimax/MiniMax-M2.7"]
# recon = ["minimax/MiniMax-M2.7"]
# judge = ["hyper/qwen3.8-flash", "minimax/MiniMax-M3"]
# auditor = ["hyper/qwen3.8-flash", "minimax/MiniMax-M3"]
# digest = ["hyper/qwen3.8-flash", "minimax/MiniMax-M3"]
#
[runs.minimax]                            # minimax on its own: M3 coordinates and works, M2.7 verifies and maps
workers = 2
coordinator = ["minimax/MiniMax-M3"]
worker = ["minimax/MiniMax-M3"]
verifier = ["minimax/MiniMax-M2.7"]
recon = ["minimax/MiniMax-M2.7"]
judge = ["minimax/MiniMax-M3"]
auditor = ["minimax/MiniMax-M3"]
digest = ["minimax/MiniMax-M3"]

