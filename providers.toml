# ---------------------------------------------------------------- run profiles: candidates per job, in order
[runs.hyper]
workers = 2                               # worker slots in flight
coordinator = ["hyper/qwen3.8-flash"]
worker = ["hyper/glm-5.3-flash"]
verifier = ["hyper/qwen3.8-flash"]
recon = ["hyper/deepseek-v4.1-flash"]
judge = ["hyper/qwen3.8-flash"]
auditor = ["hyper/qwen3.8-flash"]
digest = ["hyper/qwen3.8-flash"]

[runs.openrouter]
workers = 2
coordinator = ["openrouter/meta/muse-spark-1.3-contributor"]
worker = ["openrouter/meta/muse-spark-1.3-contributor"]
verifier = ["openrouter/z-ai/glm-5.3-flash"]
recon = ["openrouter/deepseek/deepseek-v4.1-flash"]
judge = ["openrouter/meta/muse-spark-1.3-contributor"]
auditor = ["openrouter/meta/muse-spark-1.3-contributor"]
digest = ["openrouter/meta/muse-spark-1.3-contributor"]

