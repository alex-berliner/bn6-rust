<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
  <rect x="0" y="0" width="760" height="330" fill="#fafafa"/>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#222">One battle frame, sixty times a second</text>
  <!-- frame tick -->
  <rect x="20" y="60" width="130" height="54" rx="6" fill="#fff" stroke="#888"/>
  <text x="85" y="83" text-anchor="middle" fill="#222">the frame</text><text x="85" y="101" text-anchor="middle" fill="#666" font-size="12">clock ticks</text>
  <!-- dispatcher -->
  <rect x="190" y="50" width="180" height="74" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="280" y="75" text-anchor="middle" font-weight="bold" fill="#1b5e20">object dispatcher</text>
  <text x="280" y="94" text-anchor="middle" fill="#333" font-size="12">walks the table of live objects</text>
  <text x="280" y="110" text-anchor="middle" fill="#333" font-size="12">and calls each one's routine</text>
  <!-- per-type entries -->
  <rect x="420" y="40" width="150" height="40" rx="6" fill="#f2f2f2" stroke="#999"/><text x="495" y="58" text-anchor="middle" fill="#222">enemy</text><text x="495" y="73" text-anchor="middle" fill="#666" font-size="11">think, then act</text>
  <rect x="420" y="92" width="150" height="40" rx="6" fill="#f2f2f2" stroke="#999"/><text x="495" y="110" text-anchor="middle" fill="#222">MegaMan</text><text x="495" y="125" text-anchor="middle" fill="#666" font-size="11">input, moves, attacks</text>
  <rect x="420" y="144" width="150" height="40" rx="6" fill="#f2f2f2" stroke="#999"/><text x="495" y="162" text-anchor="middle" fill="#222">shots and effects</text><text x="495" y="177" text-anchor="middle" fill="#666" font-size="11">fly, hit, vanish</text>
  <!-- animation player -->
  <rect x="190" y="200" width="380" height="64" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="380" y="224" text-anchor="middle" font-weight="bold" fill="#1b5e20">animation player</text>
  <text x="380" y="243" text-anchor="middle" fill="#333" font-size="12">steps every sprite's animation script one frame: count down, take the next step, loop or hold</text>
  <!-- screen -->
  <rect x="610" y="200" width="130" height="64" rx="6" fill="#fff" stroke="#888"/>
  <text x="675" y="228" text-anchor="middle" fill="#222">the screen</text><text x="675" y="246" text-anchor="middle" fill="#666" font-size="12">sprites drawn</text>
  <!-- arrows -->
  <line x1="150" y1="87" x2="188" y2="87" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="370" y1="70" x2="418" y2="60" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="370" y1="90" x2="418" y2="112" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="370" y1="110" x2="418" y2="164" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="495" y1="184" x2="450" y2="198" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="570" y1="232" x2="608" y2="232" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- legend -->
  <rect x="20" y="290" width="16" height="16" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/><text x="44" y="303" fill="#333" font-size="12">the original game's own code, now running in our version</text>
  <rect x="400" y="290" width="16" height="16" fill="#f2f2f2" stroke="#999"/><text x="424" y="303" fill="#333" font-size="12">still our own code at the time of this post</text>
</svg>
