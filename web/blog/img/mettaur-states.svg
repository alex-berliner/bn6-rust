<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="420" fill="#fafafa"/>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#222">The Mettaur's five decision states</text>
  <!-- spawn note -->
  <rect x="20" y="60" width="150" height="64" rx="6" fill="#fff" stroke="#888"/>
  <text x="95" y="84" text-anchor="middle" font-weight="bold" fill="#222">first frame only</text>
  <text x="95" y="102" text-anchor="middle" fill="#666" font-size="12">wait 31 frames,</text>
  <text x="95" y="117" text-anchor="middle" fill="#666" font-size="12">then start deciding</text>
  <!-- check the row -->
  <rect x="205" y="60" width="185" height="64" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="297" y="86" text-anchor="middle" font-weight="bold" fill="#1b5e20">check the row</text>
  <text x="297" y="105" text-anchor="middle" fill="#333" font-size="12">is MegaMan level with me?</text>
  <!-- hop and wait -->
  <rect x="475" y="60" width="200" height="64" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="575" y="84" text-anchor="middle" font-weight="bold" fill="#1b5e20">hop and wait</text>
  <text x="575" y="102" text-anchor="middle" fill="#333" font-size="12">one panel toward his row,</text>
  <text x="575" y="117" text-anchor="middle" fill="#333" font-size="12">six frames, then a cooldown</text>
  <!-- choose the attack -->
  <rect x="205" y="200" width="185" height="86" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="297" y="224" text-anchor="middle" font-weight="bold" fill="#1b5e20">choose the attack</text>
  <text x="297" y="243" text-anchor="middle" fill="#333" font-size="12">swing for 64 frames,</text>
  <text x="297" y="258" text-anchor="middle" fill="#333" font-size="12">release the shockwave,</text>
  <text x="297" y="273" text-anchor="middle" fill="#333" font-size="12">recover for 40 more</text>
  <!-- wander -->
  <rect x="475" y="200" width="200" height="86" rx="6" fill="#f2f2f2" stroke="#999"/>
  <text x="575" y="224" text-anchor="middle" font-weight="bold" fill="#222">wander</text>
  <text x="575" y="243" text-anchor="middle" fill="#333" font-size="12">blind or confused only:</text>
  <text x="575" y="258" text-anchor="middle" fill="#333" font-size="12">a random hop, then the roll</text>
  <text x="575" y="273" text-anchor="middle" fill="#333" font-size="12">— 2 chances in 16 to attack</text>
  <!-- guard -->
  <rect x="205" y="330" width="470" height="52" rx="6" fill="#f2f2f2" stroke="#999"/>
  <text x="440" y="352" text-anchor="middle" font-weight="bold" fill="#222">guard</text>
  <text x="440" y="370" text-anchor="middle" fill="#333" font-size="12">only for a Mettaur carrying an equipped ability; the first-version one never gets here</text>
  <!-- arrows -->
  <line x1="170" y1="92" x2="203" y2="92" stroke="#444" stroke-width="1.5" marker-end="url(#m)"/>
  <line x1="390" y1="78" x2="473" y2="78" stroke="#444" stroke-width="1.5" marker-end="url(#m)"/>
  <text x="432" y="70" text-anchor="middle" fill="#666" font-size="11">rows differ</text>
  <line x1="473" y1="108" x2="392" y2="108" stroke="#444" stroke-width="1.5" marker-end="url(#m)"/>
  <text x="432" y="124" text-anchor="middle" fill="#666" font-size="11">hop landed</text>
  <line x1="297" y1="126" x2="297" y2="198" stroke="#444" stroke-width="1.5" marker-end="url(#m)"/>
  <text x="289" y="162" text-anchor="end" fill="#666" font-size="11">same row</text>
  <path d="M 203 250 C 175 250, 175 110, 201 110" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#m)"/>
  <text x="170" y="182" text-anchor="end" fill="#666" font-size="11">after the swing</text>
  <line x1="392" y1="118" x2="472" y2="200" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mg)"/>
  <text x="470" y="170" fill="#999" font-size="11">blind or confused</text>
  <line x1="473" y1="243" x2="392" y2="243" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mg)"/>
  <text x="432" y="235" text-anchor="middle" fill="#999" font-size="11">2 in 16</text>
  <path d="M 677 212 C 740 212, 740 40, 655 40 L 350 40 L 350 56" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mg)"/>
  <text x="500" y="33" text-anchor="middle" fill="#999" font-size="11">otherwise idle for 50 frames</text>
  <line x1="297" y1="288" x2="297" y2="328" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mg)"/>
  <text x="306" y="312" fill="#999" font-size="11">equipped ability</text>
  <!-- legend -->
  <rect x="20" y="394" width="16" height="16" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="44" y="407" fill="#333" font-size="12">the states this Mettaur runs through in every fight</text>
  <rect x="400" y="394" width="16" height="16" fill="#f2f2f2" stroke="#999"/>
  <text x="424" y="407" fill="#333" font-size="12">in the original, but behind a condition nothing here can cause yet</text>
</svg>
