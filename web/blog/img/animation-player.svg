<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
  <rect x="0" y="0" width="760" height="300" fill="#fafafa"/>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#222">How the animation player moves one sprite</text>
  <!-- bind -->
  <rect x="20" y="60" width="170" height="70" rx="6" fill="#fff" stroke="#888"/>
  <text x="105" y="84" text-anchor="middle" font-weight="bold" fill="#222">1. bind</text>
  <text x="105" y="102" text-anchor="middle" fill="#333" font-size="12">find the sprite's animation</text><text x="105" y="117" text-anchor="middle" fill="#333" font-size="12">script in the game's data</text>
  <!-- tick loop -->
  <rect x="230" y="50" width="300" height="130" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="380" y="74" text-anchor="middle" font-weight="bold" fill="#1b5e20">2. every frame</text>
  <text x="380" y="96" text-anchor="middle" fill="#333" font-size="12">count the current picture's timer down by one</text>
  <text x="380" y="114" text-anchor="middle" fill="#333" font-size="12">at zero: take the script's next step (new picture, new timer)</text>
  <text x="380" y="132" text-anchor="middle" fill="#333" font-size="12">at the script's end: loop back, or hold the last picture</text>
  <text x="380" y="160" text-anchor="middle" fill="#666" font-size="11">the pose you see is whatever picture is current when the frame is drawn</text>
  <!-- switch -->
  <rect x="570" y="50" width="170" height="60" rx="6" fill="#fff" stroke="#888"/>
  <text x="655" y="72" text-anchor="middle" font-weight="bold" fill="#222">3. switch</text>
  <text x="655" y="90" text-anchor="middle" fill="#333" font-size="12">a routine asks for a new</text><text x="655" y="104" text-anchor="middle" fill="#333" font-size="12">animation (attack, hurt, idle)</text>
  <!-- gate -->
  <rect x="570" y="130" width="170" height="60" rx="6" fill="#fff" stroke="#888"/>
  <text x="655" y="152" text-anchor="middle" font-weight="bold" fill="#222">4. gate</text>
  <text x="655" y="170" text-anchor="middle" fill="#333" font-size="12">skip the count during a</text><text x="655" y="184" text-anchor="middle" fill="#333" font-size="12">time stop; rebind after a switch</text>
  <!-- arrows -->
  <line x1="190" y1="95" x2="228" y2="95" stroke="#444" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="568" y1="80" x2="532" y2="90" stroke="#444" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="568" y1="160" x2="532" y2="140" stroke="#444" stroke-width="1.5" marker-end="url(#b)"/>
  <path d="M 300 180 C 300 220, 460 220, 460 182" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="380" y="215" text-anchor="middle" fill="#666" font-size="11">next frame</text>
  <text x="20" y="270" fill="#333" font-size="12">Steps 1 and 2 landed first; 3 and 4 followed in the second ticket. All four now run the original game's rules, so a pose held one frame too short cannot happen by construction.</text>
</svg>
