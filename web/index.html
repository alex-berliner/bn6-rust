<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bn — play in the browser</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
  header { padding: 10px 16px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header a { color: #8cf; }
  #game { width: 100vw; height: calc(100vh - 44px); }
  kbd { background: #333; border-radius: 3px; padding: 0 5px; }
</style>
</head>
<body>
<header>
  <h1>bn</h1>
  <span>d-pad <kbd>arrows</kbd> · buster <kbd>X</kbd> (B) · chip <kbd>Z</kbd> (A) · start <kbd>Enter</kbd> · select <kbd>Shift</kbd></span>
  <a id="dl" href="bn6-rust.gba" download>download the .gba</a>
  <span id="build"></span>
</header>
<div id="game"></div>
<script>
  // EmulatorJS runs mGBA compiled to WebAssembly; its loader and core come
  // from its CDN, so a client needs internet for those, while the ROM is
  // served from here. A cache-busting query keeps a rebuilt ROM fresh.
  const stamp = Date.now();
  EJS_player = '#game';
  EJS_core = 'gba';
  EJS_gameName = 'bn6-rust';
  EJS_gameUrl = 'bn6-rust.gba?' + stamp;
  EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  EJS_startOnLoaded = true;
  EJS_backgroundColor = '#111';
  EJS_defaultControls = {
    0: {
      0: { value: 'x', value2: 'BUTTON_2' },       // B  = buster
      8: { value: 'z', value2: 'BUTTON_1' },       // A  = chip
      2: { value: 'shift', value2: 'SELECT' },
      3: { value: 'enter', value2: 'START' },
      4: { value: 'up arrow', value2: 'DPAD_UP' },
      5: { value: 'down arrow', value2: 'DPAD_DOWN' },
      6: { value: 'left arrow', value2: 'DPAD_LEFT' },
      7: { value: 'right arrow', value2: 'DPAD_RIGHT' },
      10: { value: 'a', value2: 'LEFT_TOP_SHOULDER' },
      11: { value: 's', value2: 'RIGHT_TOP_SHOULDER' },
    },
    1: {},
    2: {},
    3: {},
  };
  fetch('build.txt?' + stamp).then(r => r.ok ? r.text() : '').then(t => {
    document.getElementById('build').textContent = t ? 'build ' + t.trim() : '';
  }).catch(() => {});
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
