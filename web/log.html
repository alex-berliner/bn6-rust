<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bn — screenshot log</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
  header { padding: 10px 16px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header a { color: #8cf; }
  main { padding: 16px; }
  .entry { display: flex; gap: 16px; padding: 14px 0; border-bottom: 1px solid #222; align-items: flex-start; }
  .thumb { flex: 0 0 360px; max-width: 360px; }
  .thumb img { width: 100%; display: block; image-rendering: pixelated; background: #000; border-radius: 6px; }
  .meta { flex: 1; }
  .meta .stamp { color: #888; font-size: 12px; }
  .meta .tag { display: inline-block; background: #2a3a4a; color: #aee; border-radius: 3px; padding: 1px 7px; font-size: 11px; margin-right: 8px; }
  .meta .caption { margin: 6px 0 0; color: #ddd; }
  .empty { color: #888; padding: 40px 0; text-align: center; }
  a { color: #8cf; }
</style>
</head>
<body>
<header>
  <h1>bn — screenshot log</h1>
  <a href="index.html">&larr; all pages</a> <a href="play.html">play the demos</a>
  <a href="gifs.html">capture gallery</a>
  <span class="stamp">newest first</span>
</header>
<main id="log"></main>
<script>
  const stamp = Date.now();
  const el = document.getElementById('log');
  fetch('log/log.json?' + stamp).then(r => r.ok ? r.json() : []).then(entries => {
    if (!entries.length) {
      el.innerHTML = '<div class="empty">No screenshots logged yet — add one with tools/log_entry.py.</div>';
      return;
    }
    // Reverse chronological: newest first.
    entries.sort((a, b) => b.t - a.t);
    for (const e of entries) {
      const row = document.createElement('div');
      row.className = 'entry';
      const when = new Date(e.t * 1000).toLocaleString();
      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      const img = document.createElement('img');
      img.src = e.file + '?' + stamp;
      img.alt = e.caption;
      img.loading = 'lazy';
      thumb.appendChild(img);
      const meta = document.createElement('div');
      meta.className = 'meta';
      const stampEl = document.createElement('div');
      stampEl.className = 'stamp';
      stampEl.textContent = when + (e.tag ? ' · ' + e.tag : '');
      meta.appendChild(stampEl);
      const cap = document.createElement('p');
      cap.className = 'caption';
      cap.textContent = e.caption;
      meta.appendChild(cap);
      row.appendChild(thumb);
      row.appendChild(meta);
      el.appendChild(row);
    }
  }).catch(() => {});
</script>
</body>
</html>
