<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bn — how it works, one slide at a time</title>
<style>
  :root {
    --ink: #16181d;
    --dim: #5c6472;
    --line: #d9dde4;
    --paper: #fbfbf9;
    --card: #f2f3ef;
    --accent: #1d4ed8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* The feed: one screen per slide, snapping as you scroll, swipe or wheel. */
  #feed {
    height: 100dvh;
    overflow-y: scroll;
    overflow-x: hidden;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #feed::-webkit-scrollbar { display: none; }

  .slide {
    scroll-snap-align: start;
    scroll-snap-stop: always;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    width: 100%;
    max-width: 42rem;
    margin: 0 auto;
    padding: 1.1rem 1rem calc(2.4rem + env(safe-area-inset-bottom));
  }
  .slide + .slide { border-top: 1px solid var(--line); }
  /* No picture: nothing flexes, so centre the words rather than leave a hole. */
  .slide.nopic { justify-content: center; gap: 0.85rem; }

  h2 {
    margin: 0;
    font-size: clamp(1.25rem, 5.2vw, 1.6rem);
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  /* The picture takes whatever height is left over, so a tall screen
     shows a big one and a short screen still fits the words in. */
  .shot {
    flex: 1 1 auto;
    min-height: 8rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .shot img {
    max-height: 100%;
    max-width: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    image-rendering: pixelated;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
  }

  .src {
    margin: 0;
    font: 400 0.78rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--dim);
  }
  pre {
    margin: 0;
    padding: 0.65rem 0.8rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow-x: hidden;
    overflow-y: hidden;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    tab-size: 4;
    font: 400 clamp(10.5px, 2.7vw, 13px)/1.42 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .text {
    margin: 0;
    font-size: clamp(1rem, 3.9vw, 1.12rem);
    line-height: 1.5;
  }

  /* Linked highlighting: a coloured span in the code and the phrase in the
     explanation that talks about it share a colour and a `data-h` number.
     Five soft pastels; the text itself stays the page's dark ink. */
  mark {
    background: none;
    color: inherit;
    border-radius: 3px;
    padding: 0 0.14em;
    text-decoration: none;
    cursor: pointer;
  }
  /* Inside the code, no side padding: it would shift the monospace columns. */
  pre mark { padding: 0; border-radius: 2px; }
  mark.h1 { background: #fbeea6; }
  mark.h2 { background: #cee2fa; }
  mark.h3 { background: #cdecd2; }
  mark.h4 { background: #fad5e2; }
  mark.h5 { background: #fbdcbd; }
  /* Hovered or tapped: both halves of the pair brighten together. */
  mark.on.h1 { background: #f5dc48; }
  mark.on.h2 { background: #96c6f6; }
  mark.on.h3 { background: #8ed99d; }
  mark.on.h4 { background: #f5a4c2; }
  mark.on.h5 { background: #f7bd80; }
  mark.on { box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.2); }

  /* Fixed furniture: the counter and the dots. */
  #counter {
    position: fixed;
    left: 0.9rem;
    bottom: calc(0.7rem + env(safe-area-inset-bottom));
    font: 600 0.8rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--dim);
    background: rgba(251, 251, 249, 0.86);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.35rem 0.6rem;
    pointer-events: none;
  }
  #dots {
    position: fixed;
    right: 0.55rem;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
  }
  #dots button {
    width: 8px;
    height: 8px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: #c6ccd6;
    cursor: pointer;
  }
  #dots button[aria-current="true"] { background: var(--accent); transform: scale(1.4); }
  /* Clears the remembered place and jumps back to the first slide. */
  #dots .restart {
    width: auto;
    height: auto;
    margin-top: 0.35rem;
    padding: 0.2rem 0.3rem;
    border-radius: 4px;
    background: none;
    color: var(--dim);
    font: 600 0.62rem/1 system-ui, sans-serif;
    letter-spacing: 0.02em;
    writing-mode: vertical-rl;
  }
  #dots .restart:hover { color: var(--accent); }

  #home {
    position: fixed;
    right: 0.9rem;
    bottom: calc(0.7rem + env(safe-area-inset-bottom));
    font-size: 0.8rem;
    color: var(--dim);
    background: rgba(251, 251, 249, 0.86);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.35rem 0.6rem;
    text-decoration: none;
  }

  @media (prefers-reduced-motion: reduce) {
    #feed { scroll-behavior: auto; }
  }
  @media (min-width: 700px) {
    .slide { padding: 1.6rem 1rem 2.6rem; gap: 0.85rem; }
  }
</style>
</head>
<body>

<main id="feed" tabindex="-1"></main>
<div id="counter">1 / 1</div>
<nav id="dots" aria-label="slides"></nav>
<a id="home" href="index.html">bn</a>

<noscript>
  <p style="max-width:42rem;margin:2rem auto;padding:0 1rem">
    This page builds its slides with a small script; turn JavaScript on, or read
    <a href="learn/slides.js">learn/slides.js</a>, which holds every slide's words and code.
  </p>
</noscript>

<script src="learn/slides.js"></script>
<script>
  // Where the reader got to, kept between visits. localStorage throws in a
  // few browser settings (private mode, site data blocked), so a cookie is
  // the fallback; if both fail the page simply forgets, which is harmless.
  var POS_KEY = 'learn.pos';
  function savePos(n) {
    try {
      localStorage.setItem(POS_KEY, String(n));
      return;
    } catch (e) { /* fall through to the cookie */ }
    try {
      document.cookie = POS_KEY + '=' + n + ';path=/;max-age=31536000;SameSite=Lax';
    } catch (e) { /* nothing left to try */ }
  }
  function loadPos() {
    var raw = null;
    try { raw = localStorage.getItem(POS_KEY); } catch (e) { raw = null; }
    if (raw === null) {
      var hit = (' ' + document.cookie).match(/[; ]learn\.pos=(\d+)/);
      raw = hit ? hit[1] : null;
    }
    var n = parseInt(raw, 10);
    return isNaN(n) ? null : n;
  }
  function clearPos() {
    try { localStorage.removeItem(POS_KEY); } catch (e) { /* ignore */ }
    try { document.cookie = POS_KEY + '=;path=/;max-age=0;SameSite=Lax'; } catch (e) { /* ignore */ }
  }

  var feed = document.getElementById('feed');
  var dots = document.getElementById('dots');
  var counter = document.getElementById('counter');
  var slides = (typeof SLIDES !== 'undefined' && SLIDES) || [];

  function escapeHtml(raw) {
    return raw.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Turn one raw string into escaped HTML with each highlighted substring
  // wrapped in its own <mark>. Matching happens on the RAW string, before
  // escaping, so a pair in slides.js is written exactly as the code reads.
  // A substring that is missing, ambiguous or overlapping is skipped with a
  // warning: the slide still renders, just without that colour.
  function highlight(raw, subs, where) {
    var ranges = [];
    subs.forEach(function (sub, k) {
      if (!sub) { return; }
      var at = raw.indexOf(sub);
      if (at < 0) {
        console.warn('learn: highlight ' + (k + 1) + ' of ' + where + ' not found: ' + JSON.stringify(sub));
        return;
      }
      if (raw.indexOf(sub, at + 1) >= 0) {
        console.warn('learn: highlight ' + (k + 1) + ' of ' + where + ' matches more than once: ' + JSON.stringify(sub));
        return;
      }
      ranges.push({ at: at, end: at + sub.length, n: k + 1 });
    });
    ranges.sort(function (a, b) { return a.at - b.at; });
    var out = '';
    var cut = 0;
    ranges.forEach(function (r) {
      if (r.at < cut) {
        console.warn('learn: highlight ' + r.n + ' of ' + where + ' overlaps an earlier one');
        return;
      }
      out += escapeHtml(raw.slice(cut, r.at));
      out += '<mark class="h' + r.n + '" data-h="' + r.n + '">' + escapeHtml(raw.slice(r.at, r.end)) + '</mark>';
      cut = r.end;
    });
    return out + escapeHtml(raw.slice(cut));
  }

  // Hovering either half of a pair brightens both. A tap has no hover, so a
  // click keeps the pair lit until the next click.
  function linkMarks(sec) {
    var marks = Array.prototype.slice.call(sec.querySelectorAll('mark[data-h]'));
    var stuck = null;
    function paint(n, on) {
      marks.forEach(function (m) {
        if (m.getAttribute('data-h') === n) { m.className = 'h' + n + (on ? ' on' : ''); }
      });
    }
    marks.forEach(function (m) {
      var n = m.getAttribute('data-h');
      m.addEventListener('mouseenter', function () { paint(n, true); });
      m.addEventListener('mouseleave', function () { if (stuck !== n) { paint(n, false); } });
      m.addEventListener('click', function () {
        if (stuck !== null && stuck !== n) { paint(stuck, false); }
        stuck = stuck === n ? null : n;
        paint(n, stuck === n);
      });
    });
  }

  // Build every slide from the data in learn/slides.js. Both the code and
  // the explanation go in as escaped HTML so their highlights can be marked;
  // a snippet's < and & still need no escaping in that file.
  slides.forEach(function (s, i) {
    var pairs = s.highlights || [];
    var sec = document.createElement('section');
    sec.className = s.image ? 'slide' : 'slide nopic';
    sec.id = 'slide-' + (i + 1);

    var h = document.createElement('h2');
    h.textContent = s.title;
    sec.appendChild(h);

    if (s.image) {
      var box = document.createElement('div');
      box.className = 'shot';
      var img = document.createElement('img');
      img.src = s.image;
      img.alt = s.imageAlt || '';
      // Only the first picture is worth loading up front; the rest are
      // large GIFs that can wait until the reader scrolls to them.
      if (i > 0) { img.loading = 'lazy'; }
      img.decoding = 'async';
      box.appendChild(img);
      sec.appendChild(box);
    }

    if (s.code) {
      var path = document.createElement('p');
      path.className = 'src';
      path.textContent = s.codePath || '';
      sec.appendChild(path);
      var pre = document.createElement('pre');
      var code = document.createElement('code');
      code.innerHTML = highlight(s.code, pairs.map(function (h) { return h.code; }), 'slide ' + (i + 1) + ' code');
      pre.appendChild(code);
      sec.appendChild(pre);
    }

    var p = document.createElement('p');
    p.className = 'text';
    p.innerHTML = highlight(s.text, pairs.map(function (h) { return h.text; }), 'slide ' + (i + 1) + ' text');
    sec.appendChild(p);

    linkMarks(sec);
    feed.appendChild(sec);

    var dot = document.createElement('button');
    dot.type = 'button';
    dot.title = s.title;
    dot.setAttribute('aria-label', 'slide ' + (i + 1) + ': ' + s.title);
    dot.addEventListener('click', function () { go(i); });
    dots.appendChild(dot);
  });

  var sections = Array.prototype.slice.call(feed.querySelectorAll('.slide'));
  var buttons = Array.prototype.slice.call(dots.querySelectorAll('button'));
  var current = 0;

  function mark(i) {
    current = i;
    counter.textContent = (i + 1) + ' / ' + sections.length;
    buttons.forEach(function (b, k) { b.setAttribute('aria-current', k === i ? 'true' : 'false'); });
    savePos(i);
  }

  function go(i) {
    i = Math.max(0, Math.min(sections.length - 1, i));
    if (!sections[i]) { return; }
    feed.scrollTo({ top: sections[i].offsetTop, behavior: 'smooth' });
    mark(i);
  }

  // Which slide is on screen: whichever one covers the middle of the window.
  function sync() {
    var mid = feed.scrollTop + feed.clientHeight / 2;
    for (var i = sections.length - 1; i >= 0; i--) {
      if (sections[i].offsetTop <= mid) { if (i !== current) { mark(i); } return; }
    }
  }
  var ticking = false;
  feed.addEventListener('scroll', function () {
    if (ticking) { return; }
    ticking = true;
    requestAnimationFrame(function () { ticking = false; sync(); });
  }, { passive: true });

  // The same job, done by the browser where it can: whichever slide covers
  // most of the window is the current one. `sync` above stays as the fallback
  // for browsers without an observer.
  if (typeof IntersectionObserver === 'function') {
    var seen = new IntersectionObserver(function (entries) {
      var best = null;
      entries.forEach(function (e) {
        if (e.isIntersecting && (!best || e.intersectionRatio > best.intersectionRatio)) { best = e; }
      });
      if (!best) { return; }
      var i = sections.indexOf(best.target);
      if (i >= 0 && i !== current) { mark(i); }
    }, { root: feed, threshold: [0.5, 0.75] });
    sections.forEach(function (sec) { seen.observe(sec); });
  }

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) { return; }
    var k = e.key;
    if (k === 'ArrowDown' || k === 'ArrowRight' || k === 'PageDown' || k === 'j' || k === ' ' || k === 'Spacebar') {
      e.preventDefault(); go(current + 1);
    } else if (k === 'ArrowUp' || k === 'ArrowLeft' || k === 'PageUp' || k === 'k') {
      e.preventDefault(); go(current - 1);
    } else if (k === 'Home') {
      e.preventDefault(); go(0);
    } else if (k === 'End') {
      e.preventDefault(); go(sections.length - 1);
    }
  });

  // "Start over": forget the remembered place and go back to the top.
  var restart = document.createElement('button');
  restart.type = 'button';
  restart.className = 'restart';
  restart.textContent = 'start over';
  restart.title = 'forget where I was and go back to slide 1';
  restart.addEventListener('click', function () {
    clearPos();
    go(0);
  });
  dots.appendChild(restart);

  // Where to land. An address ending in #slide-3 wins; otherwise the slide
  // the reader last had on screen; otherwise the first.
  var want = parseInt((location.hash.match(/^#slide-(\d+)$/) || [])[1], 10);
  if (!(want >= 1 && want <= sections.length)) {
    var saved = loadPos();
    if (saved !== null && saved >= 0 && saved < sections.length) { want = saved + 1; }
  }
  mark(0);
  if (want >= 1 && want <= sections.length) {
    // Jump rather than glide: a smooth scroll across twenty-odd slides on
    // load is a long, pointless animation.
    var to = sections[want - 1];
    feed.scrollTop = to.offsetTop;
    mark(want - 1);
  }
</script>
</body>
</html>
