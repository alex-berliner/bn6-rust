[package]
name = "bn"
version = "0.1.0"
edition = "2024"

[dependencies]
# Vendored from github.com/agbrs/agb at tag v0.25.0 (1c2842c954fe1dd40a4b0ce0fbecf4ab7157745a)
# so engine-level features can be added upstream-side rather than worked around here.
agb = { path = "vendor/agb/agb" }

[profile.dev]
opt-level = 3
debug = true

[profile.dev.build-override]
opt-level = 3

[profile.release]
# Both from agb's project template (9a30cff). Fat LTO keeps code size and IWRAM use down; it is
# also why boot length moves with code size, which the marker handles (HANDOFF §4). debug = true
# gives mGBA's GDB stub and addr2line symbols, and it is NOT codegen-neutral: on 2026-09-12 the
# .gba was 537,708 bytes with it and 541,132 without, differing from byte 261. Every harness
# number is measured on this profile, so do not flip either setting without rerunning the table.
lto = "fat"
debug = true

# Each demo feature builds a bespoke ROM that showcases one mechanic: the
# chip is preloaded into the hand (A fires it at once) with the target
# placed so it hits on the first press, or a single enemy is fielded so its
# AI can be seen alone. See tools/build_roms.sh.
[features]
default = []
# Every demo-* feature turns this on, so the battle only has to test one
# feature to know it is a demo build.
demo = []
demo-buster = ["demo"]
demo-sword = ["demo"]
demo-wideswrd = ["demo"]
demo-longswrd = ["demo"]
demo-hicannon = ["demo"]
demo-mcannon = ["demo"]
demo-areagrab = ["demo"]
demo-vulcan2 = ["demo"]
demo-vulcan3 = ["demo"]
demo-recov50 = ["demo"]
demo-fireswrd = ["demo"]
demo-aquaswrd = ["demo"]
demo-elecswrd = ["demo"]
demo-bambswrd = ["demo"]
demo-blkbomb = ["demo"]
demo-bigbomb = ["demo"]
demo-wideblde = ["demo"]
demo-longblde = ["demo"]
demo-recov300 = ["demo"]
demo-recov80 = ["demo"]
demo-recov120 = ["demo"]
demo-recov150 = ["demo"]
demo-recov200 = ["demo"]
demo-suprvulc = ["demo"]
demo-muramasa = ["demo"]
demo-stepswrd = ["demo"]
demo-recov30 = ["demo"]
demo-invisibl = ["demo"]
demo-barrier = ["demo"]
demo-barr100 = ["demo"]
demo-barr200 = ["demo"]
demo-energbom = ["demo"]
demo-megenbom = ["demo"]
demo-lilbolr = ["demo"]
demo-flshbom = ["demo"]
demo-poisseed = ["demo"]
demo-iceseed = ["demo"]
demo-grasseed = ["demo"]
demo-bugbomb = ["demo"]
demo-vdoll = ["demo"]
demo-hudmatch = ["demo"]
demo-custmatch = ["demo"]
demo-cardname = ["demo-custmatch"]
demo-resultmatch = ["demo"]
# The real save state's layout: MegaMan at (2,2), a Mettaur at (5,2), for
# comparing the whole screen with backgrounds on.
demo-field = ["demo"]
# The ENEMY DELETED banner on its own, put up on a known frame in the sterile
# arena so it can be compared with the real ROM's.
demo-banner = ["demo"]
# The battle-start capture's own line-up: three Mettaurs in a diagonal, so a
# battle's whole opening can be compared against /tmp/battlestart.state.
demo-open = ["demo"]
demo-minibomb = ["demo"]
demo-cannon = ["demo"]
demo-vulcan = ["demo"]
demo-airshot = ["demo"]
demo-recovery = ["demo"]
demo-mettaur = ["demo"]
demo-gunner = ["demo"]
demo-protoman = ["demo"]
demo-colonel = ["demo"]
demo-results = ["demo"]
# A sterile test arena: MegaMan alone on a plain background, no field tiles,
# no enemy and no win/lose conclusion, so a chip animation can be captured
# frame-by-frame and compared pixel-per-pixel against the real ROM (which is
# patched the same way). Pair with a demo-* chip feature.
demo-sterile = ["demo"]
# When combined with a demo-* chip feature, MegaMan fires the loaded hand
# chips on a repeating timer instead of waiting for input, so a capture run
# can watch the attack without key timing.
demo-auto = ["demo"]
