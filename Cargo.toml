[package]
name = "bn"
version = "0.1.0"
edition = "2024"

[dependencies]
# Vendored from github.com/agbrs/agb at tag v0.25.0 (1c2842c954fe1dd40a4b0ce0fbecf4ab7157745a)
# so engine-level features can be added upstream-side rather than worked around here.
agb = { path = "vendor/agb/agb" }

[profile.dev]
opt-level = 3
debug = true

[profile.dev.build-override]
opt-level = 3

[profile.release]
lto = "fat"
debug = true

# Each demo feature builds a bespoke ROM that showcases one mechanic: the
# chip is preloaded into the hand (A fires it at once) with the target
# placed so it hits on the first press, or a single enemy is fielded so its
# AI can be seen alone. See tools/build_roms.sh.
[features]
default = []
demo-buster = []
demo-sword = []
demo-minibomb = []
demo-cannon = []
demo-vulcan = []
demo-airshot = []
demo-recovery = []
demo-mettaur = []
demo-gunner = []
demo-protoman = []
demo-colonel = []
demo-results = []
