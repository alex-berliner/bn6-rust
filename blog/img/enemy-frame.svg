<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs><marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
  <rect x="0" y="0" width="760" height="400" fill="#fafafa"/>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#222">One enemy, one frame, sixty times a second</text>
  <!-- the frame -->
  <rect x="20" y="52" width="120" height="64" rx="6" fill="#fff" stroke="#888"/>
  <text x="80" y="82" text-anchor="middle" fill="#222">the frame</text>
  <text x="80" y="100" text-anchor="middle" fill="#666" font-size="12">clock ticks</text>
  <!-- dispatcher -->
  <rect x="175" y="52" width="200" height="64" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="275" y="76" text-anchor="middle" font-weight="bold" fill="#1b5e20">object dispatcher</text>
  <text x="275" y="94" text-anchor="middle" fill="#333" font-size="12">walks the table of live objects</text>
  <text x="275" y="109" text-anchor="middle" fill="#333" font-size="12">and hands over each one in turn</text>
  <!-- identity row -->
  <rect x="410" y="52" width="200" height="64" rx="6" fill="#fff" stroke="#888"/>
  <text x="510" y="76" text-anchor="middle" font-weight="bold" fill="#222">the enemy's row</text>
  <text x="510" y="94" text-anchor="middle" fill="#666" font-size="12">three bytes in the game's data:</text>
  <text x="510" y="109" text-anchor="middle" fill="#666" font-size="12">version, kind, which brain</text>
  <!-- the routine -->
  <rect x="140" y="142" width="420" height="96" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="350" y="165" text-anchor="middle" font-weight="bold" fill="#1b5e20">the enemy's own routine, one entry per action</text>
  <rect x="160" y="176" width="185" height="52" rx="5" fill="#fff" stroke="#2e7d32"/>
  <text x="252" y="197" text-anchor="middle" font-weight="bold" fill="#1b5e20">think</text>
  <text x="252" y="216" text-anchor="middle" fill="#333" font-size="12">its handler for this action</text>
  <rect x="360" y="176" width="180" height="52" rx="5" fill="#fff" stroke="#2e7d32"/>
  <text x="450" y="197" text-anchor="middle" font-weight="bold" fill="#1b5e20">act</text>
  <text x="450" y="216" text-anchor="middle" fill="#333" font-size="12">damage, death, attack pose</text>
  <!-- still ours -->
  <rect x="580" y="150" width="160" height="80" rx="6" fill="#f2f2f2" stroke="#999"/>
  <text x="660" y="176" text-anchor="middle" font-weight="bold" fill="#222">still ours</text>
  <text x="660" y="196" text-anchor="middle" fill="#333" font-size="12">the Gunner's cursor</text>
  <text x="660" y="211" text-anchor="middle" fill="#333" font-size="12">and the shots it fires</text>
  <!-- animation player -->
  <rect x="140" y="266" width="420" height="64" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="350" y="291" text-anchor="middle" font-weight="bold" fill="#1b5e20">animation player</text>
  <text x="350" y="311" text-anchor="middle" fill="#333" font-size="12">count the current pose's timer down, take the next pose at zero</text>
  <!-- screen -->
  <rect x="600" y="266" width="140" height="64" rx="6" fill="#fff" stroke="#888"/>
  <text x="670" y="294" text-anchor="middle" fill="#222">the screen</text>
  <text x="670" y="312" text-anchor="middle" fill="#666" font-size="12">sprites drawn</text>
  <!-- arrows -->
  <line x1="140" y1="84" x2="173" y2="84" stroke="#444" stroke-width="1.5" marker-end="url(#e)"/>
  <line x1="375" y1="84" x2="408" y2="84" stroke="#444" stroke-width="1.5" marker-end="url(#e)"/>
  <line x1="480" y1="118" x2="480" y2="140" stroke="#444" stroke-width="1.5" marker-end="url(#e)"/>
  <line x1="345" y1="202" x2="358" y2="202" stroke="#444" stroke-width="1.5" marker-end="url(#e)"/>
  <line x1="560" y1="190" x2="578" y2="190" stroke="#444" stroke-width="1.5" marker-end="url(#e)"/>
  <line x1="350" y1="240" x2="350" y2="264" stroke="#444" stroke-width="1.5" marker-end="url(#e)"/>
  <line x1="560" y1="298" x2="598" y2="298" stroke="#444" stroke-width="1.5" marker-end="url(#e)"/>
  <!-- legend -->
  <rect x="20" y="352" width="16" height="16" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="44" y="365" fill="#333" font-size="12">the original game's own code, now running in our version</text>
  <rect x="440" y="352" width="16" height="16" fill="#f2f2f2" stroke="#999"/>
  <text x="464" y="365" fill="#333" font-size="12">still our own code at the time of this post</text>
</svg>
